<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Automation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        h2 { color: #ff7b00; }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        .card {
            background: #161b22;
            padding: 20px;
            width: 90%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.6);
            transition: background 0.3s, transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .switch-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .switch {
            position: relative;
            width: 50px;
            height: 25px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: red;
            border-radius: 25px;
            transition: 0.3s;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 2.5px;
            background-color: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        input:checked + .slider {
            background-color: green;
        }
        input:checked + .slider:before {
            transform: translateX(25px);
        }
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        input[type="range"] {
            width: 100%;
            margin-top: 5px;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        input:disabled {
            opacity: 0.3;
        }
        .status-box {
            margin-top: 20px;
            padding: 10px;
            background: #161b22;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h2>Home Automation Control</h2>
    <div class="container">
        <div id="load-container"></div>
        <div class="status-box">
            <h3>ESP32 Status</h3>
            <p>Temperature: <span id="esp-temp">--</span>°C</p>
            <p>Voltage: <span id="esp-voltage">--</span>V</p>
        </div>
    </div>

    <script>
        function createLoadControls(loadNumber) {
            const container = document.createElement("div");
            container.classList.add("card");
            
            const label = document.createElement("label");
            label.textContent = `Load ${loadNumber}`;
            
            const switchWrapper = document.createElement("label");
            switchWrapper.classList.add("switch");
            
            const input = document.createElement("input");
            input.type = "checkbox";
            input.addEventListener("change", () => {
                slider.disabled = !input.checked;
                container.style.boxShadow = input.checked ? `0 4px 15px rgba(0, 255, 0, ${slider.value / 100})` : "0 4px 15px rgba(255, 0, 0, 0.6)";
            });
            
            const sliderSpan = document.createElement("span");
            sliderSpan.classList.add("slider");
            
            switchWrapper.appendChild(input);
            switchWrapper.appendChild(sliderSpan);
            
            const sliderContainer = document.createElement("div");
            sliderContainer.classList.add("slider-container");
            
            const percentageDisplay = document.createElement("span");
            percentageDisplay.textContent = "50%";
            
            const slider = document.createElement("input");
            slider.type = "range";
            slider.min = 0;
            slider.max = 100;
            slider.value = 50;
            slider.disabled = true;
            slider.addEventListener("input", () => {
                percentageDisplay.textContent = `${slider.value}%`;
                if (input.checked) {
                    container.style.boxShadow = `0 4px 15px rgba(0, 255, 0, ${slider.value / 100})`;
                }
            });
            
            sliderContainer.appendChild(percentageDisplay);
            sliderContainer.appendChild(slider);
            
            container.appendChild(label);
            container.appendChild(switchWrapper);
            container.appendChild(sliderContainer);
            
            document.getElementById("load-container").appendChild(container);
        }

        for (let i = 1; i <= 4; i++) {
            createLoadControls(i);
        }

        function fetchESP32Data() {
            fetch("https://your-cloud-api.com/status")
                .then(response => response.json())
                .then(data => {
                    document.getElementById("esp-temp").innerText = data.temperature;
                    document.getElementById("esp-voltage").innerText = data.voltage;
                });
        }

        setInterval(fetchESP32Data, 2000);
    </script>
</body>
</html>
